<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>

  <!-- Subtle glow ring -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" opacity="0.25"/>

  <!-- Geometric Wakeel 'W' Monogram -->
  <g id="monogram">
    <!-- Center focal point -->
    <circle cx="256" cy="118" r="22" fill="url(#emeraldGrad)" filter="url(#glow)"/>

    <!-- Sharp architectural W stroke -->
    <path
      d="M 124 168 L 194 366 L 256 228 L 318 366 L 388 168"
      fill="none"
      stroke="url(#emeraldGrad)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glow)"
    />
  </g>
</svg>
