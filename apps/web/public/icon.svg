<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Wakeel">
  <!--
    Wakeel app mark: scales of justice on the brand emerald tile.

    Built for 16x16 first — that is the size a browser tab actually renders.
    Every stroke is >= 34/512 units (~1.1px at 16px) so nothing thins out to
    nothing, the pans are solid rather than outlined, and there are no SVG
    filters or hairline chains (the previous mark had 6-unit chains and a
    Gaussian glow, both of which turned to mush below 32px).

    Colours are the real brand tokens: emerald-500 -> emerald-700, matching
    `--primary` in globals.css. The filled tile means the mark keeps its
    contrast on a light or a dark browser tab without needing a variant.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>

  <g fill="#ffffff">
    <!-- finial -->
    <circle cx="256" cy="122" r="24"/>

    <!-- beam -->
    <rect x="88" y="152" width="336" height="34" rx="17"/>

    <!-- pan hangers -->
    <rect x="125" y="182" width="22" height="34" rx="11"/>
    <rect x="365" y="182" width="22" height="34" rx="11"/>

    <!-- pans: solid bowls, flat across the top -->
    <path d="M60 214a76 56 0 0 0 152 0Z"/>
    <path d="M300 214a76 56 0 0 0 152 0Z"/>

    <!-- column -->
    <rect x="239" y="186" width="34" height="200" rx="8"/>

    <!-- base -->
    <rect x="148" y="380" width="216" height="38" rx="19"/>
  </g>
</svg>
