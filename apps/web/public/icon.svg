<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Wakeel">
  <!-- Wakeel app mark: the same W monogram as the in-app logo (components/wakeel-monogram.tsx),
       scaled 16x from its 32-unit grid. Built for a 16px tab first: the W stroke is 46/512
       (~1.4px at 16px) and the dot ~1.5px, so both survive at favicon size. Filled emerald tile
       keeps contrast on light and dark tabs. Colours = brand primary (globals.css). -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0B8A5C"/>
      <stop offset="1" stop-color="#00573A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#t)"/>
  <path d="M128 172 L192 380 L256 236 L320 380 L384 172" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="130" r="25" fill="#FFFFFF"/>
</svg>
