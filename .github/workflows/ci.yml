name: CI

# `dev` is the integration branch (Vercel deploys it to production), so every
# PR into it — and every push to it — must pass this before it ships.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lawyer_agency_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    # prisma.config.ts resolves these when it loads, even for `generate`.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lawyer_agency_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lawyer_agency_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lawyer_agency_shadow
      REDIS_URL: redis://localhost:6379
      MASTER_ENCRYPTION_KEY: a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (workspace root)
        run: npm ci
        working-directory: .
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx tsc -p tsconfig.build.json --noEmit
      - run: npx eslint "src/**/*.ts"
      - run: npx vitest run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (workspace root)
        run: npm ci
        working-directory: .
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
