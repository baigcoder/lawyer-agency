# NGINX reverse proxy for Wakeel (Phase 15).
# Routes /backend/* to the API service and everything else to the Next.js
# dashboard. Serves the web push service worker directly from the public
# directory to avoid Next.js routing issues.

upstream api {
    server api:3001;
}

upstream web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Health endpoint exposed at the edge for load balancer checks.
    location /health {
        access_log off;
        proxy_pass http://api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API surface — same-origin proxy convention (D-038).
    location /backend/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Web push service worker must be served at root scope.
    location = /service-worker.js {
        proxy_pass http://web/service-worker.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Service-Worker-Allowed "/";
    }

    # Dashboard (Next.js standalone).
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
